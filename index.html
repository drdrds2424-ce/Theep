<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart POS - المقهى الذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary: #2c3e50;
            --accent: #e67e22;
            --accent-hover: #d35400;
            --text-main: #2d3436;
            --text-muted: #636e72;
            --border: #edf2f7;
            --shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
            --radius: 14px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 25px; }

        /* Header التفاعلي */
        header {
            background: var(--primary);
            color: white;
            padding: 12px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { font-size: 1.2rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .logo i { color: var(--accent); animation: pulse 2s infinite; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .nav-tabs {
            display: flex;
            gap: 6px;
            background: rgba(255, 255, 255, 0.12);
            padding: 4px;
            border-radius: 25px;
            width: 100%;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8rem;
            flex: 1;
            text-align: center;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .tab-btn.active {
            background: var(--accent);
            box-shadow: 0 4px 10px rgba(230, 126, 34, 0.4);
        }

        .container { padding: 12px; max-width: 1200px; margin: 0 auto; }
        
        .tab-content { 
            display: none; 
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .tab-content.active { 
            display: block; 
            opacity: 1;
            transform: translateY(0);
        }

        /* كروت المنتجات التفاعلية */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
            padding: 8px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow);
            border-color: var(--accent);
        }

        .product-card:active { transform: scale(0.96); }

        .product-img { 
            width: 100%; 
            height: 95px; 
            object-fit: cover; 
            border-radius: 8px; 
            transition: var(--transition);
        }

        .product-title { font-weight: 700; font-size: 0.85rem; margin-top: 6px; }
        .product-stock { font-size: 0.72rem; color: var(--text-muted); }
        .product-price { font-weight: 800; color: var(--accent); font-size: 0.9rem; }

        /* السلة والسجلات */
        .cart-section, .history-section {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 14px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .cart-header { 
            font-weight: 800; 
            border-bottom: 2px solid var(--bg-color); 
            padding-bottom: 8px; 
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
        }

        .cart-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 8px; 
            background: var(--bg-color);
            border-radius: 8px;
            margin-bottom: 8px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .qty-controls { display: flex; align-items: center; gap: 6px; }
        .qty-btn { 
            background: white; 
            border: 1px solid var(--border); 
            width: 26px; 
            height: 26px; 
            border-radius: 50%; 
            font-weight: bold; 
            cursor: pointer;
            transition: var(--transition);
        }
        .qty-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }

        .cart-summary { margin-top: 12px; padding-top: 10px; border-top: 2px solid var(--bg-color); }
        .summary-row { display: flex; justify-content: space-between; font-size: 0.95rem; font-weight: 700; margin-bottom: 6px; }
        
        .checkout-btn { 
            width: 100%; 
            background: var(--accent); 
            color: white; 
            border: none; 
            padding: 12px; 
            border-radius: 10px; 
            font-weight: 800; 
            font-size: 0.95rem;
            margin-top: 8px; 
            cursor: pointer;
            transition: var(--transition);
        }

        .checkout-btn:hover { background: var(--accent-hover); transform: translateY(-2px); }

        /* نموذج الإدارة وتعديل المبيعات */
        .form-card { background: var(--card-bg); padding: 14px; border-radius: var(--radius); margin-bottom: 15px; border: 1px solid var(--border); }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 3px; }
        .form-group input { 
            width: 100%; 
            padding: 9px; 
            border: 1px solid #cbd5e1; 
            border-radius: 8px; 
            font-size: 0.85rem;
            outline: none;
            transition: var(--transition);
        }
        .form-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.15); }

        .submit-btn { 
            width: 100%; 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 10px; 
            border-radius: 8px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: var(--transition);
        }

        /* الجداول والتصميم المعتمد */
        .table-responsive { overflow-x: auto; background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; font-size: 0.82rem; text-align: right; }
        th, td { padding: 10px; border-bottom: 1px solid var(--border); }
        th { background: #f8fafc; font-weight: 700; color: var(--primary); }
        .td-img { width: 38px; height: 38px; border-radius: 6px; object-fit: cover; }
        
        .action-btn { 
            border: none; 
            background: none; 
            cursor: pointer; 
            padding: 4px 6px; 
            border-radius: 6px;
            transition: var(--transition);
        }
        .action-btn:hover { background: var(--bg-color); }
        .editable-input { width: 70px; padding: 4px; border: 1px solid #ccc; border-radius: 4px; }
        .editable-time { width: 130px; padding: 4px; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-mug-hot"></i> Smart POS
        </div>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('pos')"><i class="fa-solid fa-cash-register"></i> نقطة البيع</button>
            <button class="tab-btn" onclick="switchTab('history')"><i class="fa-solid fa-clock-rotate-left"></i> المبيعات</button>
            <button class="tab-btn" onclick="switchTab('admin')"><i class="fa-solid fa-boxes-stacked"></i> الإدارة</button>
        </div>
    </header>

    <div class="container">
        
        <!-- POS -->
        <div id="pos-tab" class="tab-content active">
            <div class="products-grid" id="pos-products"></div>

            <div class="cart-section">
                <div class="cart-header"><i class="fa-solid fa-receipt"></i> القائمة الحالية</div>
                <div id="cart-items"></div>
                <div class="cart-summary">
                    <div class="summary-row"><span>المبلغ الكلي:</span><span id="total-price">0 د.ع</span></div>
                    <button class="checkout-btn" onclick="checkout()"><i class="fa-solid fa-check"></i> تأكيد الطلب</button>
                </div>
            </div>
        </div>

        <!-- History (سجل المبيعات) -->
        <div id="history-tab" class="tab-content">
            <div class="history-section">
                <div class="cart-header"><i class="fa-solid fa-list-check"></i> سجل المبيعات السابقة (متاح للتعديل)</div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>اسم المنتج</th>
                                <th>الكمية</th>
                                <th>الإجمالي (د.ع)</th>
                                <th>تاريخ ووقت البيع</th>
                                <th>إجراء</th>
                            </tr>
                        </thead>
                        <tbody id="history-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Admin -->
        <div id="admin-tab" class="tab-content">
            <div class="form-card">
                <h4 id="form-title" style="margin-bottom:8px;">إضافة منتج جديد</h4>
                <form id="product-form" onsubmit="handleFormSubmit(event)">
                    <input type="hidden" id="edit-id">
                    <div class="form-group"><label>اسم المنتج</label><input type="text" id="p-name" required></div>
                    <div class="form-group"><label>السعر (د.ع)</label><input type="number" id="p-price" required></div>
                    <div class="form-group"><label>المخزون</label><input type="number" id="p-stock" required></div>
                    <div class="form-group"><label>الصورة</label><input type="file" id="p-file" accept="image/*"></div>
                    <button type="submit" class="submit-btn" id="submit-btn">حفظ</button>
                </form>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>الصورة</th>
                            <th>الاسم</th>
                            <th>السعر</th>
                            <th>المخزون</th>
                            <th>إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        var products = [
            { id: 1, name: "اسبريسو", price: 2500, stock: 40, img: "https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?w=300&q=80" },
            { id: 2, name: "كابتشينو", price: 3500, stock: 25, img: "https://images.unsplash.com/photo-1534778101976-62847782c213?w=300&q=80" }
        ];

        var salesHistory = [];

        try {
            var saved = localStorage.getItem('cafe_products');
            if(saved) products = JSON.parse(saved);

            var savedSales = localStorage.getItem('cafe_sales');
            if(savedSales) salesHistory = JSON.parse(savedSales);
        } catch(e){}

        var cart = [];

        function saveProducts() {
            localStorage.setItem('cafe_products', JSON.stringify(products));
        }

        function saveSales() {
            localStorage.setItem('cafe_sales', JSON.stringify(salesHistory));
        }

        function switchTab(tabName) {
            var btns = document.querySelectorAll('.tab-btn');
            btns[0].classList.toggle('active', tabName === 'pos');
            btns[1].classList.toggle('active', tabName === 'history');
            btns[2].classList.toggle('active', tabName === 'admin');

            document.getElementById('pos-tab').classList.toggle('active', tabName === 'pos');
            document.getElementById('history-tab').classList.toggle('active', tabName === 'history');
            document.getElementById('admin-tab').classList.toggle('active', tabName === 'admin');

            if(tabName === 'pos') renderPOS();
            if(tabName === 'history') renderHistoryTable();
            if(tabName === 'admin') renderAdminTable();
        }

        function renderPOS() {
            var grid = document.getElementById('pos-products');
            grid.innerHTML = '';
            products.forEach(function(p) {
                var card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = function() { addToCart(p.id); };
                card.innerHTML = 
                    '<img src="' + p.img + '" class="product-img" onerror="this.src=\'https://via.placeholder.com/100\'">' +
                    '<div class="product-title">' + p.name + '</div>' +
                    '<div class="product-stock">متبقي: ' + p.stock + '</div>' +
                    '<div class="product-price">' + p.price + ' د.ع</div>';
                grid.appendChild(card);
            });
        }

        function addToCart(id) {
            var product = products.find(function(p){ return p.id === id; });
            if (!product || product.stock <= 0) return alert('المنتج نفد!');

            var item = cart.find(function(i){ return i.id === id; });
            if (item) {
                if (item.qty < product.stock) item.qty++;
            } else {
                cart.push({ id: product.id, name: product.name, price: product.price, qty: 1 });
            }
            renderCart();
        }

        function updateQty(id, change) {
            var item = cart.find(function(i){ return i.id === id; });
            if (item) {
                item.qty += change;
                if (item.qty <= 0) cart = cart.filter(function(i){ return i.id !== id; });
            }
            renderCart();
        }

        function renderCart() {
            var container = document.getElementById('cart-items');
            container.innerHTML = '';
            var total = 0;

            cart.forEach(function(item) {
                total += item.price * item.qty;
                var div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = 
                    '<div><b>' + item.name + '</b><br><small>' + item.price + ' × ' + item.qty + '</small></div>' +
                    '<div class="qty-controls">' +
                        '<button class="qty-btn" onclick="updateQty(' + item.id + ', 1)">+</button>' +
                        '<span>' + item.qty + '</span>' +
                        '<button class="qty-btn" onclick="updateQty(' + item.id + ', -1)">-</button>' +
                    '</div>';
                container.appendChild(div);
            });

            document.getElementById('total-price').innerText = total + ' د.ع';
        }

        function checkout() {
            if(cart.length === 0) return alert('السلة فارغة!');

            var now = new Date();
            var dateStr = now.toISOString().slice(0, 16);

            cart.forEach(function(item) {
                var p = products.find(function(prod){ return prod.id === item.id; });
                if(p) p.stock -= item.qty;

                salesHistory.push({
                    saleId: Date.now() + Math.random(),
                    name: item.name,
                    qty: item.qty,
                    totalPrice: item.price * item.qty,
                    time: dateStr
                });
            });

            saveProducts();
            saveSales();
            cart = [];
            renderCart();
            renderPOS();
            alert('تم تأكيد الطلب وحفظ البيع!');
        }

        function renderHistoryTable() {
            var tbody = document.getElementById('history-table-body');
            tbody.innerHTML = '';

            salesHistory.forEach(function(sale, index) {
                tbody.innerHTML += 
                    '<tr>' +
                        '<td><b>' + sale.name + '</b></td>' +
                        '<td><input type="number" class="editable-input" value="' + sale.qty + '" onchange="updateSale(' + index + ', \'qty\', this.value)"></td>' +
                        '<td><input type="number" class="editable-input" value="' + sale.totalPrice + '" onchange="updateSale(' + index + ', \'totalPrice\', this.value)"></td>' +
                        '<td><input type="datetime-local" class="editable-time" value="' + sale.time + '" onchange="updateSale(' + index + ', \'time\', this.value)"></td>' +
                        '<td>' +
                            '<button class="action-btn" onclick="deleteSale(' + index + ')"><i class="fa-solid fa-trash" style="color:#c0392b;"></i></button>' +
                        '</td>' +
                    '</tr>';
            });
        }

        function updateSale(index, key, value) {
            if(key === 'qty' || key === 'totalPrice') {
                salesHistory[index][key] = parseFloat(value) || 0;
            } else {
                salesHistory[index][key] = value;
            }
            saveSales();
        }

        function deleteSale(index) {
            if(confirm('هل تريد حذف هذا السجل؟')) {
                salesHistory.splice(index, 1);
                saveSales();
                renderHistoryTable();
            }
        }

        function renderAdminTable() {
            var tbody = document.getElementById('admin-table-body');
            tbody.innerHTML = '';
            products.forEach(function(p) {
                tbody.innerHTML += 
                    '<tr>' +
                        '<td><img src="' + p.img + '" class="td-img"></td>' +
                        '<td><b>' + p.name + '</b></td>' +
                        '<td>' + p.price + '</td>' +
                        '<td>' + p.stock + '</td>' +
                        '<td>' +
                            '<button class="action-btn" onclick="editProduct(' + p.id + ')"><i class="fa-solid fa-pen" style="color:#2980b9;"></i></button>' +
                            '<button class="action-btn" onclick="deleteProduct(' + p.id + ')"><i class="fa-solid fa-trash" style="color:#c0392b;"></i></button>' +
                        '</td>' +
                    '</tr>';
            });
        }

        function handleFormSubmit(e) {
            e.preventDefault();
