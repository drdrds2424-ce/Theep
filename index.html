<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart POS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: #f4f6f9; color: #2d3436; padding-bottom: 20px; }

        header {
            background: #2c3e50;
            color: white;
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .logo { font-size: 1.1rem; font-weight: 700; }
        .logo i { color: #e67e22; }

        .nav-tabs {
            display: flex;
            gap: 8px;
            background: rgba(255,255,255,0.1);
            padding: 4px;
            border-radius: 20px;
            width: 100%;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: white;
            padding: 8px 0;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            flex: 1;
            text-align: center;
        }

        .tab-btn.active { background: #e67e22; }

        .container { padding: 10px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .product-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #edf2f7;
            padding: 8px;
            text-align: center;
            cursor: pointer;
        }

        .product-img { width: 100%; height: 90px; object-fit: cover; border-radius: 6px; }
        .product-title { font-weight: 700; font-size: 0.85rem; margin-top: 5px; }
        .product-stock { font-size: 0.75rem; color: #636e72; }
        .product-price { font-weight: 700; color: #e67e22; font-size: 0.85rem; }

        .cart-section {
            background: white;
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #edf2f7;
        }

        .cart-header { font-weight: 700; border-bottom: 1px solid #eee; padding-bottom: 5px; margin-bottom: 10px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #f9f9f9; }
        .qty-controls { display: flex; align-items: center; gap: 8px; }
        .qty-btn { background: #eee; border: none; width: 24px; height: 24px; border-radius: 4px; font-weight: bold; cursor: pointer; }

        .cart-summary { margin-top: 10px; padding-top: 8px; border-top: 1px solid #eee; }
        .summary-row { display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; }
        .checkout-btn { width: 100%; background: #e67e22; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: 700; margin-top: 8px; cursor: pointer; }

        .form-card { background: white; padding: 12px; border-radius: 10px; margin-bottom: 15px; }
        .form-group { margin-bottom: 8px; }
        .form-group label { display: block; font-size: 0.8rem; margin-bottom: 2px; }
        .form-group input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.85rem; }
        .submit-btn { width: 100%; background: #2c3e50; color: white; border: none; padding: 8px; border-radius: 4px; font-weight: 700; cursor: pointer; }

        table { width: 100%; border-collapse: collapse; background: white; font-size: 0.8rem; }
        th, td { padding: 8px; text-align: right; border-bottom: 1px solid #eee; }
        .td-img { width: 35px; height: 35px; border-radius: 4px; object-fit: cover; }
        .action-btn { border: none; background: none; cursor: pointer; padding: 2px 5px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-mug-hot"></i> Smart POS
        </div>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('pos')">نقطة البيع</button>
            <button class="tab-btn" onclick="switchTab('admin')">إدارة المنتجات</button>
        </div>
    </header>

    <div class="container">
        
        <!-- POS -->
        <div id="pos-tab" class="tab-content active">
            <div class="products-grid" id="pos-products"></div>

            <div class="cart-section">
                <div class="cart-header"><i class="fa-solid fa-receipt"></i> القائمة الحالية</div>
                <div id="cart-items"></div>
                <div class="cart-summary">
                    <div class="summary-row"><span>المبلغ الكلي:</span><span id="total-price">0 د.ع</span></div>
                    <button class="checkout-btn" onclick="checkout()">تأكيد الطلب</button>
                </div>
            </div>
        </div>

        <!-- Admin -->
        <div id="admin-tab" class="tab-content">
            <div class="form-card">
                <h4 id="form-title" style="margin-bottom:8px;">إضافة منتج جديد</h4>
                <form id="product-form" onsubmit="handleFormSubmit(event)">
                    <input type="hidden" id="edit-id">
                    <div class="form-group"><label>اسم المنتج</label><input type="text" id="p-name" required></div>
                    <div class="form-group"><label>السعر (د.ع)</label><input type="number" id="p-price" required></div>
                    <div class="form-group"><label>المخزون</label><input type="number" id="p-stock" required></div>
                    <div class="form-group"><label>الصورة</label><input type="file" id="p-file" accept="image/*"></div>
                    <button type="submit" class="submit-btn" id="submit-btn">حفظ</button>
                </form>
            </div>

            <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr>
                            <th>الصورة</th>
                            <th>الاسم</th>
                            <th>السعر</th>
                            <th>المخزون</th>
                            <th>إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        var products = [
            { id: 1, name: "اسبريسو", price: 2500, stock: 40, img: "https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?w=300&q=80" },
            { id: 2, name: "كابتشينو", price: 3500, stock: 25, img: "https://images.unsplash.com/photo-1534778101976-62847782c213?w=300&q=80" }
        ];

        try {
            var saved = localStorage.getItem('cafe_products');
            if(saved) products = JSON.parse(saved);
        } catch(e){}

        var cart = [];

        function saveProducts() {
            localStorage.setItem('cafe_products', JSON.stringify(products));
        }

        function switchTab(tabName) {
            var btns = document.querySelectorAll('.tab-btn');
            btns[0].classList.toggle('active', tabName === 'pos');
            btns[1].classList.toggle('active', tabName === 'admin');

            document.getElementById('pos-tab').classList.toggle('active', tabName === 'pos');
            document.getElementById('admin-tab').classList.toggle('active', tabName === 'admin');

            if(tabName === 'pos') renderPOS();
            if(tabName === 'admin') renderAdminTable();
        }

        function renderPOS() {
            var grid = document.getElementById('pos-products');
            grid.innerHTML = '';
            products.forEach(function(p) {
                var card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = function() { addToCart(p.id); };
                card.innerHTML = 
                    '<img src="' + p.img + '" class="product-img" onerror="this.src=\'https://via.placeholder.com/100\'">' +
                    '<div class="product-title">' + p.name + '</div>' +
                    '<div class="product-stock">متبقي: ' + p.stock + '</div>' +
                    '<div class="product-price">' + p.price + ' د.ع</div>';
                grid.appendChild(card);
            });
        }

        function addToCart(id) {
            var product = products.find(function(p){ return p.id === id; });
            if (!product || product.stock <= 0) return alert('المنتج نفد!');

            var item = cart.find(function(i){ return i.id === id; });
            if (item) {
                if (item.qty < product.stock) item.qty++;
            } else {
                cart.push({ id: product.id, name: product.name, price: product.price, qty: 1 });
            }
            renderCart();
        }

        function updateQty(id, change) {
            var item = cart.find(function(i){ return i.id === id; });
            if (item) {
                item.qty += change;
                if (item.qty <= 0) cart = cart.filter(function(i){ return i.id !== id; });
            }
            renderCart();
        }

        function renderCart() {
            var container = document.getElementById('cart-items');
            container.innerHTML = '';
            var total = 0;

            cart.forEach(function(item) {
                total += item.price * item.qty;
                var div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = 
                    '<div><b>' + item.name + '</b><br><small>' + item.price + ' × ' + item.qty + '</small></div>' +
                    '<div class="qty-controls">' +
                        '<button class="qty-btn" onclick="updateQty(' + item.id + ', 1)">+</button>' +
                        '<span>' + item.qty + '</span>' +
                        '<button class="qty-btn" onclick="updateQty(' + item.id + ', -1)">-</button>' +
                    '</div>';
                container.appendChild(div);
            });

            document.getElementById('total-price').innerText = total + ' د.ع';
        }

        function checkout() {
            if(cart.length === 0) return alert('السلة فارغة!');
            cart.forEach(function(item) {
                var p = products.find(function(prod){ return prod.id === item.id; });
                if(p) p.stock -= item.qty;
            });
            saveProducts();
            cart = [];
            renderCart();
            renderPOS();
            alert('تم تأكيد الطلب!');
        }

        function renderAdminTable() {
            var tbody = document.getElementById('admin-table-body');
            tbody.innerHTML = '';
            products.forEach(function(p) {
                tbody.innerHTML += 
                    '<tr>' +
                        '<td><img src="' + p.img + '" class="td-img"></td>' +
                        '<td><b>' + p.name + '</b></td>' +
                        '<td>' + p.price + '</td>' +
                        '<td>' + p.stock + '</td>' +
                        '<td>' +
                            '<button class="action-btn" onclick="editProduct(' + p.id + ')"><i class="fa-solid fa-pen" style="color:#2980b9;"></i></button>' +
                            '<button class="action-btn" onclick="deleteProduct(' + p.id + ')"><i class="fa-solid fa-trash" style="color:#c0392b;"></i></button>' +
                        '</td>' +
                    '</tr>';
            });
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            var id = document.getElementById('edit-id').value;
            var name = document.getElementById('p-name').value;
            var price = parseFloat(document.getElementById('p-price').value);
            var stock = parseInt(document.getElementById('p-stock').value);
            var file = document.getElementById('p-file').files[0];

            var save = function(imgUrl) {
                if(id) {
                    var idx = products.findIndex(function(p){ return p.id == id; });
                    if(idx !== -1) products[idx] = { id: parseInt(id), name: name, price: price, stock: stock, img: imgUrl };
                } else {
                    products.push({ id: Date.now(), name: name, price: price, stock: stock, img: imgUrl });
                }
                saveProducts();
                document.getElementById('product-form').reset();
                document.getElementById('edit-id').value = '';
                renderAdminTable();
            };

            if(file) {
                var reader = new FileReader();
                reader.onload = function(evt){ save(evt.target.result); };
                reader.readAsDataURL(file);
            } else if(id) {
                var existing = products.find(function(p){ return p.id == id; });
                save(existing ? existing.img : 'https://via.placeholder.com/100');
            } else {
                save('https://via.placeholder.com/100');
            }
        }

        function editProduct(id) {
            var p = products.find(function(item){ return item.id === id; });
            if(!p) return;
            document.getElementById('edit-id').value = p.id;
            document.getElementById('p-name').value = p.name;
            document.getElementById('p-price').value = p.price;
            document.getElementById('p-stock').value = p.stock;
        }

        function deleteProduct(id) {
            if(confirm('حذف هذا المنتج؟')) {
                products = products.filter(function(p){ return p.id !== id; });
                saveProducts();
                renderAdminTable();
            }
        }

        renderPOS();
        renderCart();
    </script>
</body>
</html>
