<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة وتطبيقات المقهى</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary: #2c3e50;
            --accent: #e67e22;
            --text-main: #2d3436;
            --text-muted: #636e72;
            --border: #edf2f7;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 20px;
        }

        /* Header */
        header {
            background: var(--primary);
            color: white;
            padding: 0.8rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        @media (min-width: 600px) {
            header {
                flex-direction: row;
                justify-content: space-between;
                padding: 1rem 2rem;
            }
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo i {
            color: var(--accent);
        }

        .nav-tabs {
            display: flex;
            gap: 6px;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px;
            border-radius: 25px;
            width: 100%;
            justify-content: center;
        }

        @media (min-width: 600px) {
            .nav-tabs {
                width: auto;
            }
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            justify-content: center;
        }

        .tab-btn.active {
            background: var(--accent);
        }

        /* Layout */
        .container {
            max-width: 1200px;
            margin: 1rem auto;
            padding: 0 0.8rem;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* POS Grid Responsive Fix */
        .pos-layout {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        @media (min-width: 900px) {
            .pos-layout {
                display: grid;
                grid-template-columns: 1fr 360px;
                align-items: start;
            }
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
        }

        @media (min-width: 600px) {
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 15px;
            }
        }

        .product-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        .product-img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            background: #eee;
        }

        .product-info {
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .product-title {
            font-weight: 700;
            font-size: 0.9rem;
        }

        .product-stock {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .product-price {
            font-weight: 800;
            color: var(--accent);
            font-size: 0.95rem;
            margin-top: 2px;
        }

        /* Cart */
        .cart-section {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 1rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
        }

        .cart-header {
            font-size: 1.05rem;
            font-weight: 700;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--bg-color);
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-color);
            padding: 8px 10px;
            border-radius: 8px;
        }

        .cart-item-title {
            font-weight: 700;
            font-size: 0.85rem;
        }

        .cart-item-price {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            background: white;
            padding: 2px 6px;
            border-radius: 15px;
            border: 1px solid var(--border);
        }

        .qty-btn {
            background: none;
            border: none;
            width: 22px;
            height: 22px;
            cursor: pointer;
            font-weight: bold;
            color: var(--primary);
        }

        .cart-summary {
            margin-top: 1rem;
            padding-top: 0.8rem;
            border-top: 2px solid var(--bg-color);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .summary-row.total {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent);
        }

        .checkout-btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 8px;
        }

        /* Admin Layout */
        .admin-layout {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        @media (min-width: 850px) {
            .admin-layout {
                display: grid;
                grid-template-columns: 320px 1fr;
            }
        }

        .form-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 1rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .form-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 0.8rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .form-group input {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            font-size: 0.9rem;
        }

        .submit-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }

        .table-wrapper {
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            font-size: 0.85rem;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: #f1f5f9;
        }

        .td-img {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            object-fit: cover;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
        }

        .edit-btn { color: #2980b9; }
        .delete-btn { color: #c0392b; }
        .empty-msg { text-align: center; padding: 1.5rem; color: var(--text-muted); }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-mug-hot"></i>
            <span>Smart POS</span>
        </div>
        <div class="nav-tabs">
            <button class="tab-btn active" id="btn-pos">
                <i class="fa-solid fa-cash-register"></i> نقطة البيع
            </button>
            <button class="tab-btn" id="btn-admin">
                <i class="fa-solid fa-boxes-stacked"></i> إدارة المنتجات
            </button>
        </div>
    </header>

    <div class="container">
        
        <!-- POS Tab -->
        <div id="pos-tab" class="tab-content active">
            <div class="pos-layout">
                <div class="products-grid" id="pos-products"></div>

                <div class="cart-section">
                    <div class="cart-header">
                        <i class="fa-solid fa-receipt"></i>
                        <span>القائمة الحالية</span>
                    </div>
                    
                    <div class="cart-items" id="cart-items"></div>

                    <div class="cart-summary">
                        <div class="summary-row">
                            <span>إجمالي العناصر:</span>
                            <span id="total-count">0</span>
                        </div>
                        <div class="summary-row total">
                            <span>المبلغ الكلي:</span>
                            <span id="total-price">0 د.ع</span>
                        </div>
                        <button class="checkout-btn" id="checkout-btn">
                            <i class="fa-solid fa-check-circle"></i> تأكيد الطلب
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Admin Tab -->
        <div id="admin-tab" class="tab-content">
            <div class="admin-layout">
                <div class="form-card">
                    <div class="form-title" id="form-title">إضافة منتج جديد</div>
                    <form id="product-form">
                        <input type="hidden" id="edit-id">
                        
                        <div class="form-group">
                            <label>اسم المنتج</label>
                            <input type="text" id="p-name" required>
                        </div>

                        <div class="form-group">
                            <label>السعر (د.ع)</label>
                            <input type="number" id="p-price" required>
                        </div>

                        <div class="form-group">
                            <label>الكمية المتاحة</label>
                            <input type="number" id="p-stock" required>
                        </div>

                        <div class="form-group">
                            <label>صورة المنتج</label>
                            <input type="file" id="p-file" accept="image/*">
                        </div>

                        <button type="submit" class="submit-btn" id="submit-btn">حفظ المنتج</button>
                    </form>
                </div>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>الصورة</th>
                                <th>الاسم</th>
                                <th>السعر</th>
                                <th>المخزون</th>
                                <th>الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="admin-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        let products = [];
        try {
            products = JSON.parse(localStorage.getItem('cafe_products')) || [];
        } catch(e) { products = []; }

        if (!products || products.length === 0) {
            products = [
                { id: 1, name: "اسبريسو", price: 2500, stock: 40, img: "https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?w=300&q=80" },
                { id: 2, name: "كابتشينو", price: 3500, stock: 25, img: "https://images.unsplash.com/photo-1534778101976-62847782c213?w=300&q=80" },
                { id: 3, name: "لاتيه ميامي", price: 4000, stock: 15, img: "https://images.unsplash.com/photo-1570968915860-54d5c301fa9f?w=300&q=80" }
            ];
            localStorage.setItem('cafe_products', JSON.stringify(products));
        }

        let cart = [];

        function saveProducts() {
            localStorage.setItem('cafe_products', JSON.stringify(products));
        }

        // التبديل الصريح مع الحماية
        const btnPos = document.getElementById('btn-pos');
        const btnAdmin = document.getElementById('btn-admin');
        const posTab = document.getElementById('pos-tab');
        const adminTab = document.getElementById('admin-tab');

        btnPos.onclick = function() {
            btnPos.classList.add('active');
            btnAdmin.classList.remove('active');
            posTab.classList.add('active');
            adminTab.classList.remove('active');
            renderPOS();
        };

        btnAdmin.onclick = function() {
            btnAdmin.classList.add('active');
            btnPos.classList.remove('active');
            adminTab.classList.add('active');
            posTab.classList.remove('active');
            renderAdminTable();
        };

        function renderPOS() {
            const grid = document.getElementById('pos-products');
            if(!grid) return;
            grid.innerHTML = '';

            products.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => addToCart(p.id);
                card.innerHTML = `
                    <img src="${p.img}" class="product-img" onerror="this.src='https://via.placeholder.com/150'">
                    <div class="product-info">
                        <div class="product-title">${p.name}</div>
                        <div class="product-stock">المتبقي: ${p.stock}</div>
                        <div class="product-price">${Number(p.price).toLocaleString()} د.ع</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;
            if (product.stock <= 0) {
                alert('المنتج غير متوفر!');
                return;
            }

            const cartItem = cart.find(item => item.id === id);
            if (cartItem) {
                if (cartItem.qty < product.stock) cartItem.qty++;
                else alert('وصلت للحد الأقصى!');
            } else {
                cart.push({ ...product, qty: 1 });
            }
            renderCart();
        }

        function updateQty(id, change) {
            const cartItem = cart.find(item => item.id === id);
            const product = products.find(p => p.id === id);

            if (cartItem) {
                cartItem.qty += change;
                if (product && cartItem.qty > product.stock) cartItem.qty = product.stock;
                if (cartItem.qty <= 0) cart = cart.filter(item => item.id !== id);
            }
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            if(!container) return;
            container.innerHTML = '';

            let totalCount = 0;
            let totalPrice = 0;

            if (cart.length === 0) {
                container.innerHTML = '<div class="empty-msg">السلة فارغة</div>';
            } else {
                cart.forEach(item => {
                    const itemTotal = item.price * item.qty;
                    totalCount += item.qty;
                    totalPrice += itemTotal;

                    const div = document.createElement('div');
                    div.className = 'cart-item';
                    div.innerHTML = `
                        <div>
                            <div class="cart-item-title">${item.name}</div>
                            <div class="cart-item-price">${Number(item.price).toLocaleString()} × ${item.qty}</div>
                        </div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
                            <span>${item.qty}</span>
                            <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            }

            document.getElementById('total-count').innerText = totalCount;
            document.getElementById('total-price').innerText = totalPrice.toLocaleString() + ' د.ع';
        }

        document.getElementById('checkout-btn').onclick = function() {
            if (cart.length === 0) {
                alert('السلة فارغة!');
                return;
            }
            cart.forEach(cartItem => {
                const prod = products.find(p => p.id === cartItem.id);
                if (prod) prod.stock -= cartItem.qty;
            });
            saveProducts();
            cart = [];
            renderCart();
            renderPOS();
            alert('تم تأكيد الطلب بنجاح!');
        };

        function renderAdminTable() {
            const tbody = document.getElementById('admin-table-body');
            if(!tbody) return;
            tbody.innerHTML = '';

            products.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td><img src="${p.img}" class="td-img" onerror="this.src='https://via.placeholder.com/50'"></td>
                        <td><b>${p.name}</b></td>
                        <td>${Number(p.price).toLocaleString()}</td>
                        <td>${p.stock}</td>
                        <td>
                            <button class="action-btn edit-btn" onclick="editProduct(${p.id})"><i class="fa-solid fa-pen"></i></button>
